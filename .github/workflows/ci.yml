name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/go.mod
          cache-dependency-path: apps/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race ./...

  integration:
    name: Integration tests (Go + PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cloudflow
          POSTGRES_PASSWORD: cloudflow-ci
          POSTGRES_DB: cloudflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudflow -d cloudflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/go.mod
          cache-dependency-path: apps/go.sum

      - name: Run integration tests
        env:
          TEST_DATABASE_DSN: postgres://cloudflow:cloudflow-ci@localhost:5432/cloudflow_test?sslmode=disable
        run: go test -race -tags=integration -v ./internal/integration/

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trade-market
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/Dockerfile --target server -t cloudflow-api .

      - name: Build migrate image
        run: docker build -f apps/Dockerfile --target migrate -t cloudflow-migrate .

      - name: Build frontend image
        run: docker build -t cloudflow-frontend ./trade-market
